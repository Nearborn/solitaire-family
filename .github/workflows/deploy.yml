name: Build and publish Solitaire PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source layout
        run: |
          test -f main.py
          test -f game/play.py
          test -f assets/sprites.png
          python -m compileall -q main.py solitaire.py game tools
      - name: Install desktop pygame for headless regression tests
        run: python -m pip install pygame-ce
      - name: Test landscape rotation without losing game state
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Install Pygbag
        run: python -m pip install pygbag
      - name: Compile browser distribution
        run: python -m pygbag --build --title 'Solitaire Collection' .
      - name: Prepare installable web app
        run: python tools/prepare_web.py build/web
      - name: Verify browser viewport CSS and updated offline cache
        run: |
          grep -q 'solitaire-viewport-css' build/web/index.html
          grep -q 'solitaire-v1.4.1' build/web/sw.js
          grep -q 'canvas#canvas {' build/web/index.html
          grep -q 'pointer_bridge.js' build/web/index.html
          test -s build/web/pointer_bridge.js
          grep -q 'solitaireDrainInput' build/web/pointer_bridge.js
      - name: Inspect generated browser layers and input handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Nodes(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag in ('canvas','div','button','style','meta','script'):
                      a=dict(attrs)
                      print(tag, {k:v for k,v in a.items() if k in ('id','class','style','name','src','type')})
          html = Path('build/web/index.html').read_text(encoding='utf-8')
          print('HTML BYTES',len(html))
          Nodes().feed(html)
          for term in ('canvas','pythons','pointer-events','onmousedown','onclick','event.button','isPlaying','wasm'):
              at=0
              for i in range(5):
                  at=html.find(term,at)
                  if at<0: break
                  print(term,at,repr(html[max(0,at-180):at+250]))
                  at+=len(term)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
