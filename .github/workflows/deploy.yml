name: Build and publish Solitaire PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source layout
        run: |
          test -f main.py
          test -f game/play.py
          test -f assets/sprites.png
          python -m compileall -q main.py solitaire.py game tools
      - name: Install Pygbag
        run: python -m pip install pygbag
      - name: Compile browser distribution
        run: python -m pygbag --build --title 'Solitaire Collection' .
      - name: Prepare installable web app
        run: python tools/prepare_web.py build/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
