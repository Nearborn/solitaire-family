name: Build and publish Solitaire PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack Solitaire source archive
        run: unzip -oq Solitaire_18_Games_Android_PWA_v1_3.zip -d .
      - name: Verify game rules
        run: cd Solitaire && python -m unittest discover -s tests -v
      - name: Install Pygbag
        run: python -m pip install pygbag
      - name: Compile browser distribution
        run: python -m pygbag --build --title 'Solitaire Collection' Solitaire
      - name: Prepare web app
        run: python tools/prepare_web.py Solitaire/build/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Solitaire/build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
